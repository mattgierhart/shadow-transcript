<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Transcript Shadow — Visual Design</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  html, body { margin: 0; padding: 0; background: #0a0a0b; }
  body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro", system-ui, sans-serif; }
  @keyframes rec-pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.55; }
  }
  @keyframes blink {
    0%, 49% { opacity: 1; }
    50%, 100% { opacity: 0; }
  }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="src/tokens.jsx"></script>
<script type="text/babel" src="src/shared.jsx"></script>
<script type="text/babel" src="src/scr001.jsx"></script>
<script type="text/babel" src="src/scr002.jsx"></script>
<script type="text/babel" src="src/scr003.jsx"></script>
<script type="text/babel" src="src/scr004.jsx"></script>
<script type="text/babel" src="src/scr005.jsx"></script>
<script type="text/babel" src="src/scr006.jsx"></script>
<script type="text/babel" src="src/filmstrip.jsx"></script>
<script type="text/babel" src="src/tokens-sheet.jsx"></script>
<script type="text/babel" src="design-canvas.jsx"></script>

<script type="text/babel" data-presets="env,react">
function App() {
  return (
    <DesignCanvas
      title="Transcript Shadow"
      subtitle="Six screens · journey filmstrip · design tokens. Dark only · macOS native · local-only product (BR-101)."
    >
      {/* ---------------- 01 · The money shot ---------------- */}
      <DCSection
        id="money-shot"
        title="01 · SCR-004 — Money shot"
        subtitle="Transcript view. Dense, full-width. Speaker pills + Export to Obsidian. The screen for the landing page hero."
      >
        <DCArtboard id="scr-004-hi-res" label="SCR-004 · 1440 × 900" width={1440} height={900}>
          <ScreenSCR004 />
        </DCArtboard>
      </DCSection>

      {/* ---------------- 02 · Journey filmstrip ---------------- */}
      <DCSection
        id="filmstrip"
        title="02 · UJ-001 — Pre-flight → Ambient → Review"
        subtitle="The hide/restore transition (BR-501). Frames 02 + 03 are the load-bearing moment: main window absent, only the HUD persists."
      >
        <DCArtboard id="filmstrip-art" label="UJ-001 · 5 frames" width={2200} height={460}>
          <Filmstrip />
        </DCArtboard>
      </DCSection>

      {/* ---------------- 03 · The six screens ---------------- */}
      <DCSection
        id="screens"
        title="03 · Six screens"
        subtitle="SCR-001 through SCR-006 in source order. SCR-002 shows both HUD realizations as peers (DES-105 notch + DES-106 menu bar extra)."
      >
        <DCArtboard id="scr-001" label="SCR-001 · Main window (idle)" width={1100} height={700}>
          <ScreenSCR001 />
        </DCArtboard>

        <DCArtboard id="scr-002" label="SCR-002 · Recording HUD — peers" width={1640} height={1140}>
          <ScreenSCR002 />
        </DCArtboard>

        <DCArtboard id="scr-003" label="SCR-003 · Processing" width={1100} height={700}>
          <ScreenSCR003 />
        </DCArtboard>

        <DCArtboard id="scr-004" label="SCR-004 · Transcript view" width={1100} height={700}>
          <ScreenSCR004 width={1100} height={700} />
        </DCArtboard>

        <DCArtboard id="scr-005" label="SCR-005 · Settings sheet" width={1100} height={700}>
          <ScreenSCR005 />
        </DCArtboard>

        <DCArtboard id="scr-006" label="SCR-006 · History sidebar" width={1100} height={700}>
          <ScreenSCR006 />
        </DCArtboard>
      </DCSection>

      {/* ---------------- 04 · Tokens ---------------- */}
      <DCSection
        id="tokens"
        title="04 · Design tokens"
        subtitle="DES-301..305. One sheet for downstream prompts: palette, type scale, spacing, radii, status colors."
      >
        <DCArtboard id="tokens-sheet" label="Tokens · DES-301..305" width={1640} height={1320}>
          <TokenSheet />
        </DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
