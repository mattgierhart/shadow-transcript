# XcodeGen spec — Transcript Shadow
# @implements TECH-001, TECH-002, TECH-007, ENV-001
# Regenerate the .xcodeproj with: `xcodegen generate`

name: TranscriptShadow

options:
  bundleIdPrefix: ai.gearheart
  developmentLanguage: en
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: YES
    EXCLUDED_ARCHS[sdk=macosx*]: x86_64
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Automatic
    DEAD_CODE_STRIPPING: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: NO
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit
    from: 0.16.0
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: 6.29.0

targets:
  TranscriptShadow:
    type: application
    platform: macOS
    sources:
      - path: TranscriptShadow
        excludes:
          - "Info.plist"
          - "TranscriptShadow.entitlements"
    info:
      path: TranscriptShadow/Info.plist
      properties:
        CFBundleDevelopmentRegion: $(DEVELOPMENT_LANGUAGE)
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleName: $(PRODUCT_NAME)
        CFBundleDisplayName: Transcript Shadow
        CFBundlePackageType: APPL
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: "15.0"
        NSHumanReadableCopyright: "Copyright © 2026 Matt Gierhart. All rights reserved."
        NSMicrophoneUsageDescription: "Transcript Shadow records meeting audio from your microphone to produce private, on-device transcripts."
        NSScreenCaptureUsageDescription: "Transcript Shadow uses ScreenCaptureKit to capture system audio (other meeting participants) so it can transcribe them alongside your microphone."
        NSPrincipalClass: NSApplication
    entitlements:
      path: TranscriptShadow/TranscriptShadow.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.device.audio-input: true
        com.apple.security.network.client: true
    dependencies:
      - package: WhisperKit
      - package: GRDB
        product: GRDB
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.gearheart.TranscriptShadow
        PRODUCT_NAME: TranscriptShadow

  TranscriptShadowTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: TranscriptShadowTests
    dependencies:
      - target: TranscriptShadow
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.gearheart.TranscriptShadowTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/TranscriptShadow.app/Contents/MacOS/TranscriptShadow
        BUNDLE_LOADER: $(TEST_HOST)

schemes:
  TranscriptShadow:
    build:
      targets:
        TranscriptShadow: all
        TranscriptShadowTests: [test]
    test:
      targets:
        - TranscriptShadowTests
      gatherCoverageData: true
    run:
      config: Debug
    archive:
      config: Release
